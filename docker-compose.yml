services:
  website-lead:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website-lead-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=https://lead.d4f.me
      - OUTREACH_SENDER_EMAIL=raj@d4f.me
      - OUTREACH_SENDER_NAME=Raj
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional Cloudflare Tunnel container for Raspberry Pi hosting without opening router ports
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
